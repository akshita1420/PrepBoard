# On every push to main: check that the backend and frontend build.
# Deploying is done by the VPS itself: a timer there checks GitHub every 2 minutes and rebuilds
# when main has new commits (deploy/autodeploy.sh). GitHub can't reach the VPS over SSH, so it doesn't push.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
        run: |
          npm ci
          npm run build
