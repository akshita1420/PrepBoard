spring.application.name=backend

# Private values (mail login, push private key) live in application-local.properties next to pom.xml,
# which is git-ignored. Environment variables override everything below.
spring.config.import=optional:file:./application-local.properties

# -------------------------------------------------------------
# 1. Server Configuration
# -------------------------------------------------------------
server.port=8080


# -------------------------------------------------------------
# 2. Database Connection Settings
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/preptracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# -------------------------------------------------------------
# 3. Hibernate / JPA Configuration
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# -------------------------------------------------------------
# 4. Email Configuration (SMTP)
# -------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# -------------------------------------------------------------
# 5. Web Push / VAPID Configuration
# -------------------------------------------------------------
push.vapid.public-key=${VAPID_PUBLIC_KEY:BDIW-ovgGjwcevT7gpj1Qe8En7JmS9WTWWrwxO0Yby9rka97_PGEaFkveP1MXJbnwKnvk-m-_BSlqP9vx7I6Nf4}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:hello@prepboard.app}


# -------------------------------------------------------------
# 6. Deployment
# -------------------------------------------------------------
# Trust X-Forwarded-* from the reverse proxy (Caddy) so links like the helper download use the public https URL.
server.forward-headers-strategy=framework
# Extra browser origins allowed to call the API (comma-separated). Not needed when site and API share a domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}
